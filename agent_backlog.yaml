conventions:
  branch: "feat/<task-id>-<slug>"
  commit: "conventional commits; one concern per commit"
  pr_size_max_changed_lines: 600
  must_pass_before_push:
    - "pytest -q"
    - "ruff check . && mypy src"
    - "cd Blockchain && npx hardhat test --no-compile"
  forbidden:
    - "fabricating any CID, hash, metric, transaction or timestamp"
    - "silently falling back to placeholder values on error"
    - "claiming compliance (HIPAA/GDPR/KVKK) without an audit artefact"
    - "committing data files, .env, deployment_info.json or __pycache__"

stop_conditions:
  - "changing or deleting files under FL/Train&TestCSVs/ or LocalTraining/"
  - "adding any dependency that downloads a model or binary at build time"
  - "rewriting git history"
  - "changing the contract ABI after T-12 without updating docs/abi.md"

